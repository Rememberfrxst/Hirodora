plugins { id 'com.android.application' }

android {
    namespace 'com.rememberfrxst.hirodora'
    compileSdk 35
    defaultConfig {
        applicationId 'com.rememberfrxst.hirodora'
        minSdk 26
        targetSdk 35
        versionCode 2300
        versionName '0.23.0'
    }
    signingConfigs {
        release {
            if (System.getenv('HIRODORA_KEYSTORE')) {
                storeFile file(System.getenv('HIRODORA_KEYSTORE'))
                storePassword System.getenv('HIRODORA_STORE_PASSWORD')
                keyAlias System.getenv('HIRODORA_KEY_ALIAS') ?: 'hirodora'
                keyPassword System.getenv('HIRODORA_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
